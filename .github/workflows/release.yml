name: Validate release distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build and validation tools
        run: python -m pip install build twine
      - name: Validate source and wheel distributions
        run: |
          python -m build
          python -m twine check dist/*
