name: Unit and integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the core package
        run: python -m pip install .
      - name: Run unit and integration tests with local fixtures
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the offline benchmark
        run: python -m loopsieve benchmark benchmarks/fixtures/repeated-failure.json --json
      - name: Smoke-test the optional terminal UI
        if: runner.os == 'Linux'
        run: |
          python -m pip install '.[tui]'
          python tools/check_textual.py
