[workspace]
members = ["crates/loopsieve-core", "crates/loopsieve-cli"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
globset = "0.4"
libc = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5"
uuid = { version = "1.28", features = ["serde", "v4"] }
walkdir = "2.5"
